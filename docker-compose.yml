services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  rag:
    build: .
    image: cs-handbook-rag
    depends_on:
      - ollama
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      PDF_PATH: /app/major_handbook_pdfs/CS_MajorHandbook.pdf
      VECTOR_STORE: /app/vector_store_docker
    volumes:
      - ./major_handbook_pdfs:/app/major_handbook_pdfs:ro
      - ./vector_store_docker:/app/vector_store_docker
      - ./results:/app/results
      - ./questions.txt:/app/questions.txt:ro
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true

  # Giao diện web: http://localhost:8501
  ui:
    build: .
    image: cs-handbook-rag
    entrypoint: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      PDF_PATH: /app/major_handbook_pdfs/CS_MajorHandbook.pdf
      VECTOR_STORE: /app/vector_store_docker
    volumes:
      - ./major_handbook_pdfs:/app/major_handbook_pdfs:ro
      - ./vector_store_docker:/app/vector_store_docker
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped

volumes:
  ollama_models:
